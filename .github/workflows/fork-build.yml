name: Build fork APK

on:
  workflow_dispatch:
  push:
    branches: [writing-agent]
    tags: ['fork-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same prerequisites as upstream: web-ui is compiled into the APK.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Signing key
        env:
          KEY_BASE64: ${{ secrets.FORK_KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.FORK_SIGNING_CONFIG }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
            printf '%s\n' "$SIGNING_CONFIG" > local.properties
          else
            echo "::warning::No signing secrets; producing an unsigned release APK for testing only."
          fi

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Upstream expects a real Firebase config that we neither have nor need.
          # A placeholder keeps the Google Services plugin satisfied; analytics and
          # crash reporting simply stay inactive. Replace via secret if ever needed.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "inkwell-agent-local",
              "storage_bucket": "inkwell-agent-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111111111",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Python runtime tests
        run: python3 -m unittest discover -s app/src/main/assets/builtin_skills/fiction-writing/scripts -p 'test_*.py' -v

      - name: Build
        run: |
          chmod +x gradlew
          if [ -f app/app.key ]; then
            ./gradlew testDebugUnitTest assembleRelease --console=plain
          else
            echo "::warning::No signing key; building debug APK instead."
            ./gradlew testDebugUnitTest assembleDebug --console=plain
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: inkwell-writing-agent
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
